name: Deploy to Production (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install lftp Engine
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: 🚀 Deploy Plugins and Theme via lftp (PASV Mode)
        run: |
          lftp -c "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          set ftp:passive-mode yes;
          set ftp:use-epsv no;
          set net:timeout 60;
          set net:max-retries 10;
          set net:reconnect-interval-base 3;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};

          echo '=== [1/3] Deploying preorder-raka plugin ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/plugins/preorder-raka/ ${{ secrets.FTP_PLUGIN_DIR }}/preorder-raka/;

          echo '=== [2/3] Deploying my-wc-passkeys plugin ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/plugins/my-wc-passkeys/ ${{ secrets.FTP_PLUGIN_DIR }}/my-wc-passkeys/;

          echo '=== [3/3] Deploying raka-preorder-theme ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/themes/raka-preorder-theme/ ${{ secrets.FTP_THEME_DIR }}/raka-preorder-theme/;
          "
