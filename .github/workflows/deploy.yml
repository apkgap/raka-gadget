name: Deploy to Production (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 FTP Deploy All Plugins (wp-content/plugins)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          log-level: verbose
          state-name: .plugins-sync-state.json
          local-dir: ./app/public/wp-content/plugins/
          server-dir: ${{ secrets.FTP_PLUGIN_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/package.json
            **/package-lock.json
            **/AGENTS.md
            **/.windsurf/**

      - name: 🚀 FTP Deploy Theme (raka-preorder-theme)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          log-level: verbose
          state-name: .theme-sync-state.json
          local-dir: ./app/public/wp-content/themes/raka-preorder-theme/
          server-dir: ${{ secrets.FTP_THEME_DIR }}/raka-preorder-theme/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/package.json
            **/package-lock.json
            **/AGENTS.md
            **/.windsurf/**
