name: Fast FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Force deploy all components (ignore paths-filter)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: FTP Sync
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            theme:
              - 'app/public/wp-content/themes/raka-preorder-theme/**'
            preorder:
              - 'app/public/wp-content/plugins/preorder-raka/**'
            passkeys:
              - 'app/public/wp-content/plugins/my-wc-passkeys/**'

      - name: 🚀 FTP Deploy Theme (raka-preorder-theme)
        if: steps.changes.outputs.theme == 'true' || inputs.deploy_all == true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_THEME_DIR }}/
          local-dir: app/public/wp-content/themes/raka-preorder-theme/
          protocol: ftp
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/src/**
            package.json
            package-lock.json
            AGENTS.md

      - name: 🚀 FTP Deploy preorder-raka
        if: steps.changes.outputs.preorder == 'true' || inputs.deploy_all == true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PLUGIN_DIR }}/
          local-dir: app/public/wp-content/plugins/preorder-raka/
          protocol: ftp
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            package.json
            package-lock.json
            AGENTS.md

      - name: 🚀 FTP Deploy my-wc-passkeys
        if: steps.changes.outputs.passkeys == 'true' || inputs.deploy_all == true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PLUGIN_DIR }}/../my-wc-passkeys/
          local-dir: app/public/wp-content/plugins/my-wc-passkeys/
          protocol: ftp
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            package.json
            package-lock.json
            AGENTS.md
