name: Fast FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Sync Engine
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install lftp Engine
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: 🚀 Deploy Components via lftp (Robust PASV Mode)
        run: |
          THEME_RAW="${{ secrets.FTP_THEME_DIR }}"
          PLUGIN_RAW="${{ secrets.FTP_PLUGIN_DIR }}"

          THEME_RAW="${THEME_RAW%/}"
          PLUGIN_RAW="${PLUGIN_RAW%/}"

          # Auto-resolve exact Theme directory
          if [[ "$THEME_RAW" == *"raka-preorder-theme" ]]; then
            THEME_DIR="$THEME_RAW"
          else
            THEME_DIR="${THEME_RAW}/raka-preorder-theme"
          fi

          # Auto-resolve exact Plugin directories
          if [[ "$PLUGIN_RAW" == *"preorder-raka" ]]; then
            PREORDER_DIR="$PLUGIN_RAW"
            PASSKEYS_DIR="${PLUGIN_RAW%/preorder-raka}/my-wc-passkeys"
          else
            PREORDER_DIR="${PLUGIN_RAW}/preorder-raka"
            PASSKEYS_DIR="${PLUGIN_RAW}/my-wc-passkeys"
          fi

          echo "Target Theme Directory:    $THEME_DIR"
          echo "Target Preorder Directory: $PREORDER_DIR"
          echo "Target Passkeys Directory: $PASSKEYS_DIR"

          lftp -c "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          set ftp:passive-mode yes;
          set ftp:use-epsv no;
          set net:timeout 120;
          set net:max-retries 10;
          set net:reconnect-interval-base 3;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};

          echo '=== [1/3] Deploying raka-preorder-theme ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/themes/raka-preorder-theme/ \$THEME_DIR/;

          echo '=== [2/3] Deploying preorder-raka plugin ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/plugins/preorder-raka/ \$PREORDER_DIR/;

          echo '=== [3/3] Deploying my-wc-passkeys plugin ===';
          mirror -R -v --only-newer \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob src/ \
            --exclude-glob package*.json \
            --exclude-glob AGENTS.md \
            --exclude-glob .windsurf/ \
            ./app/public/wp-content/plugins/my-wc-passkeys/ \$PASSKEYS_DIR/;
          "
